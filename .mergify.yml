queue_rules:
    - name: default
      queue_conditions:
          - base=master
          - '#approved-reviews-by>=1'
          - '#changes-requested-reviews-by=0'
          - '#review-requested=0'
          - check-success=CI Status
          - label=ready-to-merge
          - label!=do-not-merge
          - title~=^(build|ci|chore|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?:\s.+$
      merge_conditions:
          - check-success=CI Status
      merge_method: squash

pull_request_rules:
    - name: Automatic strict merge
      conditions: []
      actions:
          queue:
